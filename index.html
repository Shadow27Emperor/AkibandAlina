<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alina & Akib - The Beginning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Yellowtail&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#eceee9}
html.lock,html.lock body{overflow:hidden;height:100%}
body{font-family:'Cormorant Garamond',Georgia,serif;color:#3f4a36;overflow-x:hidden}

/* ===== LAYER 2 : invitation (always fully visible, always underneath) ===== */
#page{position:relative;z-index:1;width:100%;max-width:520px;margin:0 auto}
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s,transform .9s}.rv.in{opacity:1;transform:none}
.hero{position:relative;background:#fff;height:100vh;height:100dvh;width:100%;box-sizing:border-box;font-size:calc(min(100vw,520px)/28);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 1em;box-shadow:0 0 40px rgba(0,0,0,.08)}
.ar{font:400 2.7em 'Amiri',serif;color:#c6a66a;margin-bottom:1.3em}
.sd{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#8a6a38;text-decoration:none;cursor:pointer;animation:bn 1.8s ease-in-out infinite}
@keyframes bn{50%{transform:translateY(9px)}}
.tw{font-size:.9em;letter-spacing:.38em;text-transform:uppercase}
.nm{white-space:nowrap;font-weight:600;font-size:3.5em;letter-spacing:.12em;margin:.35em 0;text-shadow:0 2px 3px rgba(0,0,0,.12)}.nm i{color:#c6a66a;font-style:normal;font-weight:400;font-size:.6em}
.dv{display:flex;align-items:center;gap:1em;margin:.4em 0 1.8em}.dv span{width:6em;height:1px;background:#c6a66a}.dv svg{width:2.1em;height:auto}
.eng{font-style:italic;font-size:1.5em}
.sec{padding:56px 22px 0;text-align:center}
.script{font:400 clamp(38px,11vw,50px) 'Yellowtail',cursive;color:#3f4a36;margin:0}
.sub{font-size:13px;letter-spacing:.25em;text-transform:uppercase;margin:14px 0 36px}
.circle{position:relative;width:min(78vw,340px);aspect-ratio:1;margin:0 auto;border-radius:50%;background:#fff;border:5px solid #e0c98a;box-shadow:0 18px 30px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.circle h3{margin:0;font-weight:600;font-size:clamp(26px,8vw,34px)}
.circle .g{color:#c6a66a;letter-spacing:.2em;font-weight:600;font-size:clamp(14px,4vw,18px);margin:8px 0 12px;padding-bottom:10px;border-bottom:2px solid #c6a66a}
.circle .e{letter-spacing:.12em;font-weight:500;font-size:clamp(12px,3.4vw,15px)}.circle .h{font-style:italic;font-size:12px;margin-top:8px;color:#6b7560}
#foil{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity 1s}
.cd{display:flex;gap:12px;justify-content:center;margin-top:28px}
.cd div{flex:1;max-width:100px;padding:16px 0 12px;background:#fff;border-radius:16px;box-shadow:0 8px 16px rgba(0,0,0,.1)}
.cd b{display:block;font-size:28px;font-weight:500;color:#c6a66a}.cd small{font-size:11px;letter-spacing:.15em}
.vc{margin-top:60px;background:#fff;border-radius:28px;box-shadow:0 14px 28px rgba(0,0,0,.12);overflow:hidden;padding:0 22px 28px}
.vc:before{content:"";display:block;height:12px;margin:0 -22px 14px;background:linear-gradient(90deg,#d9bd75,#f0dca2,#d9bd75)}
.vc h2{font-weight:600;font-size:clamp(24px,7vw,32px);letter-spacing:.1em;text-transform:uppercase;margin:34px 0 22px;line-height:1.25}
.vc h4{margin:0 0 22px;font-weight:600;letter-spacing:.15em;font-size:17px;color:#5a6450}.vc p{margin:0 0 26px;font-size:18px;color:#6b7560}
.ct{font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:#948f87;margin:0 0 6px!important}
.ph{font-weight:600;font-size:24px!important;letter-spacing:.08em;color:#3f4a36!important;margin:0 0 30px!important}
.bt{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:30px;color:#fff;text-decoration:none;font-weight:600;font-size:18px;margin-top:14px;box-shadow:0 6px 12px rgba(0,0,0,.15)}
.row{display:flex;gap:10px}.row .bt{flex:1;font-size:16px;gap:7px;padding:0}
.ft{text-align:center;font-size:14px;padding:50px 0 70px;color:#5a6450}

/* ===== LAYER 1 : envelope (on top until it has opened) ===== */
#env{position:fixed;inset:0;z-index:10;perspective:1800px;overflow:hidden;touch-action:none;background:#fde2c4}
#env.open{background:transparent;pointer-events:none}
.door{position:absolute;top:0;height:100%;background-size:auto 100%;background-repeat:no-repeat;
 transition:transform 1.4s cubic-bezier(.6,0,.3,1),opacity .4s ease 1s;will-change:transform}
.door::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--d),rgba(90,50,10,.28),rgba(90,50,10,0) 35%);transition:opacity 1.4s}
